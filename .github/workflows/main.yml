name: Build TVBox IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install XcodeGen via Homebrew
        run: |
          brew install xcodegen

      - name: Create Fake Secrets File
        run: |
          # 1. 强制创建 IOS-key 目录
          mkdir -p IOS-key
          
          # 2. 写入空变量定义，防止 secrets.sh 被 source 时报错
          cat << 'EOF' > IOS-key/secrets.sh
          #!/bin/bash
          export TEAM_ID=""
          export KEY_ID=""
          export ISSUER_ID=""
          EOF
          
          chmod +x IOS-key/secrets.sh

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Unsigned IPA via xcodebuild
        run: |
          # 清理构建目录
          rm -rf build
          
          # 直接打包无签名 Archive
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -sdk iphoneos \
            -archivePath build/tvbox.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # 生成 Payload 并压缩为 .ipa
          mkdir -p build/Payload
          cp -r build/tvbox.xcarchive/Products/Applications/tvbox.app build/Payload/
          cd build
          zip -r tvbox-Swift.ipa Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-Swift-IPA
          path: build/tvbox-Swift.ipa
