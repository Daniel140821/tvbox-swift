name: Build TVBox IPA

on:
  workflow_dispatch: # 允許在網頁上手動點擊執行

jobs:
  build:
    runs-on: macos-latest # 使用 GitHub 免費提供的雲端 Mac 主機

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4' # 滿足 README 要求的 Xcode 15+

      - name: Install XcodeGen via Homebrew
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Run Package Script
        run: |
          chmod +x package_ios.sh
          # 執行專案自帶的打包腳本
          ./package_ios.sh || true

      - name: Fallback Build IPA (If package_ios.sh only created xcarchive)
        run: |
          # 建立無簽名 Payload 並打包成 .ipa
          mkdir -p build/Payload
          
          # 尋找編譯出來的 .app 或 .xcarchive
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found App at: $APP_PATH"
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r tvbox-Swift.ipa Payload
          else
            echo "Direct App not found, building with xcodebuild..."
            xcodebuild archive \
              -project tvbox.xcodeproj \
              -scheme tvbox \
              -sdk iphoneos \
              -archivePath build/tvbox.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
            
            cp -r build/tvbox.xcarchive/Products/Applications/tvbox.app build/Payload/
            cd build
            zip -r tvbox-Swift.ipa Payload
          fi

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-Swift-IPA
          path: build/tvbox-Swift.ipa
